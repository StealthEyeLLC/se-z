name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-phase1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm run test:scaffold
      - run: npm run test:extracted:unit
      - run: npm run test:extracted:integration
      - run: npm run test:extracted:gateway
      - run: npm run test:parity:static
      - run: npm run test:parity:behavioral
      - run: npm run phase1:capability-map:check
      - run: npm run phase1:requirements-audit:check
      - run: npm run phase1:dependency-scan:check
      - run: npm run phase1:secret-scan:check
      - run: npm run phase1:verify
      - run: test -f dist/manifest.json
      - name: Authorized acceptance boundary
        run: |
          printf '%s\n' \
            'Exact private-source suites, live UID-0/systemd acceptance, and production readback are represented by committed content-addressed evidence.' \
            'Untrusted CI verifies that evidence and reruns all source-independent target checks; it does not receive production credentials.'

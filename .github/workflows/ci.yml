name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-phase1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm run test:scaffold
      - run: npm run test:parity:static
      - run: npm run phase1:dependency-scan
      - run: npm run phase1:secret-scan
      - name: Authorized acceptance boundary
        run: |
          printf '%s\n' \
            'Pinned private-source suites, UID-0/systemd acceptance, and production readback are not run in untrusted CI.' \
            'They are measured separately by phase1:source-test, phase1:extracted-test, and authorized final verification evidence.'
      - run: test -f dist/manifest.json

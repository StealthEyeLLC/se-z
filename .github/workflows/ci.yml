name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  canonical-scaffold:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: test -f dist/manifest.json
